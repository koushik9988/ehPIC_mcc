
[file]
#output = ../datafiles/data_ccp_B45_0.01
output = ../datafiles/data_ccp

[time]
NUM_TS = 1000000
DT_coeff = 0.005

[diagnostics]
write_interval = 100
write_interval_phase = 1000
write_diagnostics = 200
write_flag = 1  # 1 all data 2 field only 3 phase only
save_fig   = 1
sub_cycle_interval = 500 
precision = 6
diagtype =  full

[visualplot]
Energy_plot = 1
keflag = 1
peflag = 1
teflag = 1
ke_components = 0
Potentialfield_plot = 0
Chargedensity_plot = 0
phase_plot = 0
species_index = 0
coll_freq_plot = 0
dft_rho = 0

[domain]
ni       = 128
x0       = 0

[normalization]
# norm_scheme: 1 electron scale, 2 ion scale, 3 subcycling, 4 length=ion/time=electron, 5 = user-defined (lenght_scale/time_scale below)
# vel_norm_scheme: 1 electron thermal vel, 2 ion thermal vel, 3 ion acoustic vel  (IGNORED when norm_scheme = 5, kept for reference/future switch)
norm_scheme = 5
vel_norm_scheme = 2
lenght_scale = 0.001          # 1 mm grid spacing -> system length = (ni-1)*dx = 12.7cm
time_scale = 13.56E6          
energy_scale = 1

[simulation]
shapefunction = CIC
push_parallal  = true
deposit_parallal = false
density = 1E13             
see_rate = 0
tempwall = 0
ionfixed = 0
bc = open

[solver]
solver_state = 1
solvertype = direct
tolerance = 1e-5
max_iteration = 5000

[ExternalField]
#B = 0.005, 85, 80
B = 0.0
theta = 90
azimuth = 0
E_ext = 0

[boundary_potential]
# volts, radians
voltage_left = 300.0        
frequency_left = 13.56E6
phase_left = 0.0

voltage_right = 0.0
frequency_right = 0.0
phase_right = 0.0

[Emitters]
count = 0

[collision]
# true/false
elastic = true
excitation = true
ionization = true
pion_elastic = true
nion_elastic = false
e_detach_collision = false
GAS_DENSITY = 1e20             # ~30 mTorr Ar 
GAS_TYPE = AR
collgroup = 01,11              # 0-1: electron-neutral (elastic/excitation/ionization); 1-1: ion-neutral (pion_elastic)

[Species]
#number of species
count = 2

species_0.name = electron
species_0.mass = 9.10938215E-31
species_0.num = 5000
species_0.temp = 3.0
species_0.charge_sign = -1
species_0.normden = 1
species_0.vs = 0
#species_0.isfluid = 1
species_0.loadtype_pos = random
species_0.loadtype_vel = 0.0sin(0)

species_1.name = ion
species_1.mass = 6.6E-26
species_1.num = 5000
species_1.temp = 0.026
species_1.charge_sign = 1
species_1.normden = 0
species_1.vs = 0
#species_1.isfluid = 0
species_1.loadtype_pos = random
species_1.loadtype_vel = 0.0sin(0)