
# ION-ACOUSTIC SOLITON SIMPLE CASE - PIC SIMULATION CONFIG
# Based on Sam et al. (2025) Physics of Plasmas 32, 022103
# Reference case: Small amplitude soliton (N=0.5) propagation


[file]
output = ../datafiles/data/
		
[time]
# Total number of timesteps
# For small soliton: ~200 ion periods sufficient to see saturation
# omega_pi = sqrt(n0*q_e^2 / (eps0*m_i)) 
NUM_TS = 50000
# Courant factor: dt = DT_coeff * (dx / v_max)
# For stability: should be << 1, typically 0.001-0.01
DT_coeff = 0.05

[diagnostics]
# Write every N timesteps
write_interval = 100
write_interval_phase = 500
write_diagnostics = 500
write_flag = 1              # 1=all data, 2=fields only, 3=phase only                 
save_fig   = 1
sub_cycle_interval = 500
precision = 6
diagtype = full

[visualplot]
Energy_plot = 1             # Track kinetic/potential energy evolution
keflag = 1                  # Kinetic energy
peflag = 1                  # Potential energy
teflag = 1                  # Temperature evolution
ke_components = 0
Potentialfield_plot = 1     # Monitor potential field
Chargedensity_plot = 1      # Monitor charge density for Poisson check
phase_plot = 1              # Phase space plots (important for trapping!)
species_index = 0           # 0=electron, 1=ion
coll_freq_plot = 0
dft_rho = 0

[domain]
# Grid points: 1024 typically sufficient for 1D ion acoustic
# Higher resolution near soliton (adaptive refinement if available)
ni       = 1024
x0       = 0
# Domain size: ~1200 Debye lengths to avoid boundary effects
# and capture full soliton propagation over ~100 ion periods

[normalization]
norm_scheme = 1
vel_norm_scheme = 1
lenght_scale = 0.005        # Length in meters (~5 mm for typical plasma)
time_scale = omegape        # Time normalized by electron plasma frequency
energy_scale = 1

[simulation]
# Shape function: Cloud-in-Cell (CIC) recommended for good energy conservation
shapefunction = CIC
push_parallal  = true       # Parallel push for speed (if available)
deposit_parallal = false    # Charge deposition          
density = 1E13              # Reference density n_0 [m^-3]
see_rate = 0                # Secondary emission rate (disabled for soliton study)
tempwall = 0                # Wall temperature (not used for periodic BC)
ionfixed = 0                # Allow ion dynamics (0=kinetic)
bc = pbc                    # Periodic boundary conditions (important!)

[solver]
# Poisson solver for self-consistent electric field
solver_state = 1
solvertype = direct         # Direct solver (robust for 1D)
tolerance = 1e-5            # Solver convergence tolerance
max_iteration = 5000        # Maximum iterations

[ExternalField]
# No external magnetic field for simple ion-acoustic soliton
B = 0.00
theta = 0
azimuth = 0
E_ext = 0                   # No external electric field

[boundary_potential]
# Periodic BC: these values ignored but set for completeness
voltage_left = 0
frequency_left = 0
phase_left = 0.0
voltage_right = 0.0
frequency_right = 0.0
phase_right = 0.0

[Emitters]
count = 0                   # No particle emitters

[collision]
# No collisions for kinetic study (collisionless plasma)
elastic = false
excitation = false
ionization = false
pion_elastic = false
nion_elastic = false
e_detach_collision = false
GAS_DENSITY = 0
GAS_TYPE = H
collgroup = 02,12

[Species]
# Three species in this setup: electron, ion, and possibly test particle
count = 2

# ELECTRON SPECIES
species_0.name = electron
species_0.mass = 9.10938215E-31
species_0.num = 10000
species_0.temp = 1.0       
species_0.charge_sign = -1
species_0.normden = 1      
species_0.vs = 0           
species_0.loadtype_pos = gaussian    
species_0.loadtype_vel = 0.0sin(0)      


# ION SPECIES
species_1.name = ion
species_1.mass = 1.6726219E-27
species_1.num = 10000
species_1.temp = 0.0      
species_1.charge_sign = 1
species_1.normden = 0      
species_1.vs = 0           
species_1.loadtype_pos = uniform       
species_1.loadtype_vel = 0.0sin(0)      

