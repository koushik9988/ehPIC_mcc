[file]
output = ../datafiles/data_negion/
		
[time]
NUM_TS = 500000
DT_coeff = 0.001

[diagnostics]
write_interval = 100
write_interval_phase = 1000
write_diagnostics = 500
write_flag = 1  # 1 all data 2 filed only 3 phase only                 
save_fig   = 1
sub_cycle_interval = 500
precision = 6
diagtype =  full

[visualplot]
Energy_plot = 1
keflag = 1
peflag = 1
teflag = 1
ke_components = 0
Potentialfield_plot = 0
Chargedensity_plot = 0
phase_plot = 0
species_index = 0
coll_freq_plot = 0
dft_rho = 0

[domain]
ni       = 512
x0       = 0


[normalization]
# set 1 for electron scale, 2 for  ion scale, 3 for  subcycling and 4 for  lenght ion and time electron.
# set 1 for electron thermal velocity, 2 for  ion thermal velocity and  3 for  ion acoustic velocity.
norm_scheme = 2
vel_norm_scheme = 3
lenght_scale = 0.005
time_scale = omegape
energy_scale = 1

[simulation]
shapefunction = CIC
push_parallal  = true           
deposit_parallal = false                        
density = 1E13			   
#see_rate = 0
#tempwall = 0
ionfixed = 0
bc = dirneu 
dphi_dx = 0

[solver]
solver_state = 1
solvertype = direct#nlp#direct           
tolerance = 1e-5
max_iteration = 5000

[ExternalField]
#B = 0.005, 85, 80
B = 0.00
theta = 45
azimuth = 0
E_ext = 0.00


[boundary_potential]
# volts
voltage_left = 0
frequency_left = 0
phase_left = 0.0

voltage_right = 0.0
frequency_right = 0.0
phase_right = 0.0


[Emitters]
count = 0
emitter_0.emitter_loc  = 0
emitter_0.density      = 1e13
emitter_0.emitter_area = 1
emitter_0.species_id1  = 2        # negative ion
emitter_0.direction    = 1
emitter_0.temp1        = 0.2      # eV
emitter_0.spwt         = 1e7


[collision]
k_recomb = 0#1e-9 
# true /false
elastic = false
excitation = false#true  
ionization = false#true
pion_elastic = false#rue
nion_elastic = false
e_detach_collision = false
GAS_DENSITY = 0  
GAS_TYPE = H
collgroup = 02,12

[Species]
#number of species
count = 2

species_0.name = electron
species_0.mass = 9.10938215E-31
species_0.num = 20000
species_0.temp = 1.0
species_0.charge_sign = -1
species_0.normden = 1
species_0.vs = 0
#species_0.isfluid = 1
species_0.loadtype_pos = random#uniform
species_0.loadtype_vel = 0.0sin(0)

species_1.name = ion
species_1.mass = 1.6726219E-27 #6.6E-26#
species_1.num = 20000
species_1.temp = 0.05
species_1.charge_sign = 1
species_1.normden = 0
species_1.vs = 0
#species_1.isfluid = 0
species_1.loadtype_pos = random#uniform#0.4sech(6)#uniorm#gaussian#0.9sech(4)#uniform
species_1.loadtype_vel = 0.0sin(0)

species_2.name = negion
species_2.mass = 1.6726219E-27
species_2.num = 10000
species_2.temp = 0.1
species_2.charge_sign = -1
species_2.normden = 1 # for neg beam 0.5 # .25 for pos beam 
species_2.vs = 0
#species_2.isfluid = 1
species_2.loadtype_pos = random #tanh#+0.5sin(1)#uniform
species_2.loadtype_vel = 0.0sin(0) #0.0sin(0)

